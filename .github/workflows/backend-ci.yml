name: Backend CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'  # ✅ Caching dependencies

      - name: Clean and install dependencies
        run: |
          cd api
          rm -rf node_modules
          npm ci  # ✅ Cleaner install using lock file

      - name: Verify Jest installation
        run: |
          cd api
          ls -alh node_modules/.bin

      - name: Run Tests
        run: |
          cd api
          npm test
